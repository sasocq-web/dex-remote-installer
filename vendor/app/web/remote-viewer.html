<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Visor Dex Remoto</title>
  <style>
    html,body,#screen{width:100%;height:100%;margin:0;overflow:hidden;background:#080d15}
    #screen{display:flex;align-items:center;justify-content:center}
    #screen canvas{max-width:100%;max-height:100%}
    #status{position:fixed;inset:auto 12px 12px;z-index:2;padding:8px 11px;border-radius:9px;background:rgba(10,16,26,.82);color:#dce6f7;font:600 13px system-ui,sans-serif;text-align:center;pointer-events:none}
    #status.connected{opacity:0;transition:opacity .35s 1s}
    #status.error{background:rgba(92,25,35,.92);color:#fff}
  </style>
</head>
<body>
  <div id="screen" role="application" aria-label="Tela remota interativa" tabindex="0"></div>
  <div id="status" role="status" aria-live="polite" aria-atomic="true">Carregando transmissão…</div>
  <script src="/remote-viewer.js?v=20260820-projects-remote189"></script>
</body>
</html>
